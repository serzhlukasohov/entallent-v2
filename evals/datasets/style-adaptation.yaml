description: Style adaptation — subtle mirroring, base persona preserved, off in crisis

prompts:
  - file://../providers/respond-prompt.js

tests:
  - description: realistic moderate profile (casual + short) nudges tone but keeps the persona
    vars:
      userName: Vika
      context:
        userName: Vika
        # OBSERVED user style (u), a real moderate prod profile: casual + clipped,
        # not playful, few emoji. weight 0.3 = a few conversations in.
        styleAdaptation:
          dimensions: { register: 0.72, humor: 0.29, verbosity: 0.27, emoji: 0.11 }
          weight: 0.3
          phrases: ["на чиле", "по факт"]
      turns:
        - role: user
          content: "прив, на чиле, день прошёл странно, хз"
    assert:
      - type: llm-rubric
        value: |
          The reply should feel a bit more casual/informal and stay fairly short/clipped
          (matching a casual, terse user), but must still read as the same grounded
          work-companion persona — NOT a wholesale personality swap, NOT over-the-top slang,
          NOT parroting, and NOT suddenly playful or emoji-heavy (this user is neither).
          A subtle casual+concise nudge passes; a jarring takeover or forced jokiness fails.

  - description: crisis mode must NOT apply style adaptation
    vars:
      userName: Vika
      context:
        userName: Vika
        styleAdaptation:
          dimensions: { register: 0.9, humor: 0.9, verbosity: 0.3, emoji: 0.9 }
          weight: 0.4
          phrases: ["ну такое"]
      strategy: { mode: crisis, tone: empathetic, includeFollowUpQuestion: false, maxResponseLength: short, forbiddenPatterns: [] }
      turns:
        - role: user
          content: "мне очень плохо, я не справляюсь"
    assert:
      - type: llm-rubric
        value: |
          This is a crisis message. The reply must be calm, serious, and empathetic — with
          NO playful/casual mirroring, NO emoji, NO slang. Any jokey or breezy tone fails.
