    }));
  }
  // Messages read as plain chat; notes and the turn breakdown sit behind a per-message toggle.
  // `botLeft` puts the bot on the left and the employee on the right.
  function chatInto(parent, items, botLeft) {
    var chat = el('div', 'chat' + (botLeft ? ' bot-left' : ''), items.map(function (i) {
      if (i.divider) return el('div', 'divider', [i.divider]);
      var who = i.role === 'user' ? 'працівник' : 'бот';
      var hasNotes = i.notes && i.notes.length;
      var hasSections = i.sections && i.sections.length;
      var more = hasNotes || hasSections ? el('details', 'more', [
        el('summary', null, ['деталі' + (hasSections ? ' · ' + i.sections.length : '')]),
        hasNotes ? rich('p', 'notes', i.notes.join(' · ')) : null,
        hasSections ? el('div', 'turn-detail', i.sections.map(function (sec) {
          var body = sec.rows && sec.rows.length ? kvDl(sec.rows) : rich('p', 'empty', sec.empty || '—');
          var summary = el('summary', null, [el('span', 't', [sec.title]), sec.summary ? rich('span', 's', sec.summary) : null]);
          var d = el('details', 'sec', [summary, el('div', 'body', [body])]);
          if (sec.open) d.open = true;
          return d;
        })) : null,
      ]) : null;
      return el('div', 'msg ' + i.role + (i.seed ? ' seed' : '') + (i.missing ? ' missing' : ''), [
        el('span', 'who', [i.label || who, i.tested ? el('span', 'tested', ['тестується']) : null]),
        el('p', 'bubble ' + i.role, [i.text]),
        more,
      ]);
    }));
    var toggleAll = function (open) {
      return function () { chat.querySelectorAll('details.more').forEach(function (d) { d.open = open; }); };
    };
    if (chat.querySelector('details.more')) {
      var showAll = el('button', null, ['Показати всі деталі']);
      var hideAll = el('button', null, ['Сховати всі деталі']);
      showAll.type = hideAll.type = 'button';
      showAll.addEventListener('click', toggleAll(true));
      hideAll.addEventListener('click', toggleAll(false));
      parent.appendChild(el('div', 'chat-tools', [showAll, hideAll]));
    }
    parent.appendChild(chat);
  }

  var m = data.meta || {};
  document.title = m.title || 'Test Report';
  var header = el('header', null, [
    m.eyebrow ? el('p', 'eyebrow', [m.eyebrow]) : null,
    el('h1', null, [m.title || 'Test Report']),
    m.summary ? rich('p', 'lede', m.summary) : null,
    el('p', 'meta', (m.details || []).map(function (d) { return rich('span', null, d); })),
  ]);
  root.appendChild(header);

  // Suite report: one counts line, then one collapsed row per test; its blocks open when the test is expanded.
  if (data.suite) {
    var su = data.suite;
    var cnt = su.counts;
    var countText = [
      plural(cnt.total, 'тест', 'тести', 'тестів'),
      cnt.passed + ' зелених',
      cnt.failed + ' червоних',
      cnt.error ? cnt.error + ' ERROR' : null,
      cnt.skipped ? cnt.skipped + ' пропущено' : null,
    ].filter(Boolean).join(' · ');
    root.appendChild(el('p', 'suite-counts', [countText]));
    var list = section('Тести');
    var openTests = function (open) { return function () { list.querySelectorAll('details.test').forEach(function (d) { d.open = open; }); }; };
    var openBtn = el('button', null, ['Розгорнути всі тести']);
    var closeBtn = el('button', null, ['Згорнути всі тести']);
    openBtn.type = closeBtn.type = 'button';
    openBtn.addEventListener('click', openTests(true));
    closeBtn.addEventListener('click', openTests(false));
    list.appendChild(el('div', 'chat-tools', [openBtn, closeBtn]));
    var block = function (title, summary, content, open) {
      var d = el('details', 'blk', [el('summary', null, [el('span', 't', [title]), summary ? rich('span', 's', summary) : null]), el('div', 'body', content)]);
      if (open) d.open = true;
      return d;
    };
    var MARK = { true: ['tick', '✓'], false: ['cross', '✗'], info: ['infomark', 'i'] };
    su.tests.forEach(function (t) {
      var given = [kvDl(t.given.rows)];
      if (t.given.history && t.given.history.length) {
        var hist = el('div', 'given-history', [el('h5', null, ['Історія розмови до тесту'])]);
        chatInto(hist, t.given.history, true);
        given.push(hist);
      }
      var steps = el('div');
      if (t.steps.length) chatInto(steps, t.steps, true);
      else steps.appendChild(rich('p', 'empty', t.stepsEmpty || 'Кроків немає.'));
      var a = t.actual;
      var actual = [];
      if (a.failure) actual.push(rich('p', 'aside ' + (t.status === 'error' ? 'warn' : 'bad'), a.failure));
      if (a.comparisons.length) {
        actual.push(table(['', 'Очікувано', 'Фактично', 'Звідки'], a.comparisons.map(function (r) {
          var mk = MARK[r.met];
          return [{ node: el('span', mk[0], [mk[1]]) }, { text: r.expected, kind: 'wide' }, { text: r.actual, tone: r.met === false ? 'miss' : r.met === 'info' ? 'warn' : null }, { text: r.source, tone: 'muted' }];
        })));
      }
      var j = a.judge;
      var judge = el('div', 'judge', [el('h5', null, [j.title])]);
      if (j.reasoning) judge.appendChild(el('p', 'reasoning', [j.reasoning]));
      actual.push(judge);
      list.appendChild(el('details', 'test ' + t.status, [
        el('summary', 'test-head', [status(t.status), el('span', 'test-id', [t.id]), el('span', 'test-name', [t.name]), el('span', 'test-dur', [t.duration])]),
        el('div', 'test-body', [
          block('Опис', t.descriptionSummary, [kvDl(t.description)], true),
          block('Given: стан до тесту', t.given.summary, given, true),
          block('Кроки', t.stepsSummary, [steps], true),
          block('Фактичний результат', a.summary, actual, true),
        ]),
      ]));
    });
  }

  if (data.verdict) {
    root.appendChild(el('div', 'verdict-banner ' + data.verdict.status, [status(data.verdict.status), rich('p', null, data.verdict.text)]));
  }

  if (data.stats && data.stats.length) {
    root.appendChild(el('div', 'stats', data.stats.map(function (s) {
      return el('div', 'stat ' + (s.tone || ''), [el('b', null, [s.value]), rich('span', null, s.label)]);
    })));
  }

  if (data.scope) {
    var sc = section(data.scope.title || 'Що перевіряли');
    sc.appendChild(el('div', 'cols', (data.scope.panels || []).map(function (p) {
      return el('div', 'panel', [el('h4', null, [p.title]), el('ul', null, p.items.map(function (i) { return rich('li', null, i); }))]);
    })));
  }

  if (data.pipeline) {
    var pl = section(data.pipeline.title || 'Як це працює', data.pipeline.explain);
    var flow = el('div', 'pipeline');
    data.pipeline.steps.forEach(function (st, i) {
      if (i) flow.appendChild(el('span', 'arrow', ['→']));
      flow.appendChild(rich('span', 'node' + (st.isNew ? ' new' : ''), st.label));
    });
    pl.appendChild(flow);
    if (data.pipeline.notes) pl.appendChild(el('div', 'notes', [el('ul', null, data.pipeline.notes.map(function (n) { return rich('li', null, n); }))]));
    if (data.pipeline.legend) pl.appendChild(rich('p', 'legend', data.pipeline.legend));
  }

  if (data.checks) {
    var ck = section(data.checks.title || 'Перевірки', data.checks.explain);
    ck.appendChild(table(['Перевірка', 'Статус', 'Результат', 'Команда', 'Примітка'], data.checks.rows.map(function (r) {
      return [{ text: r.name, kind: 'wide' }, { node: status(r.status) }, { text: r.result, kind: 'num' }, { text: r.command ? '`' + r.command + '`' : '' }, { text: r.note || '', tone: 'muted' }];
    })));
  }

  (data.tables || []).forEach(function (t) {
    var ts = section(t.title, t.explain);
    ts.appendChild(table(t.columns, t.rows));
  });

  if (data.cases && data.cases.length) {
    var cs = section(data.casesTitle || 'Сценарії', data.casesExplain);
    cs.appendChild(el('nav', 'toc', data.cases.map(function (c) {
      var a = el('a', null, [el('span', 'dot ' + c.verdict), c.title]);
      a.href = '#' + c.id;
      return a;
    })));
    data.cases.forEach(function (c) {
      var art = el('article', 'case');
      art.id = c.id;
      art.appendChild(el('header', 'case-head', [
        el('div', null, [c.eyebrow ? el('p', 'eyebrow', [c.eyebrow]) : null, el('h3', null, [c.title]), c.subtitle ? rich('p', 'sub', c.subtitle) : null]),
        status(c.verdict),
      ]));
      var flowEl = el('div', 'flow');
      c.steps.forEach(function (s) {
        var step = el('section', 'step', [el('h4', null, [s.title]), s.intro ? rich('p', 'explain step-intro', s.intro) : null]);
        if (s.type === 'user' || s.type === 'bot') {
          var b = el('p', 'bubble ' + s.type);
          if (s.text) b.appendChild(document.createTextNode(s.text));
          if (s.fixedText) { if (s.text) b.appendChild(document.createTextNode('\n\n')); b.appendChild(el('span', 'fixed', [s.fixedText])); }
          step.appendChild(b);
        } else if (s.type === 'dialogue') {
          chatInto(step, s.items);
        } else if (s.type === 'info') {
          step.appendChild(el('div', 'info', s.groups.map(function (g) {
            return el('div', null, [el('h5', null, [g.title]), el('ul', g.code ? 'code' : null, g.items.map(function (i) {
              return g.code ? el('li', i.indexOf('//') === 0 ? 'comment' : null, [i]) : rich('li', null, i);
            }))]);
          })));
        } else if (s.type === 'raw') {
          s.items.forEach(function (r) {
            var d = el('details', 'raw', [el('summary', null, [r.title]), el('div', 'body', [tree(r.json)])]);
            step.appendChild(d);
          });
        } else if (s.type === 'kv') {
          step.appendChild(el('dl', null, s.rows.map(function (r) {
            return el('div', 'kv', [el('dt', null, [r.key]), rich('dd', r.tone || null, r.value)]);
          })));
        } else if (s.type === 'judge' || s.type === 'checks') {
          step.appendChild(el('ul', 'criteria', s.items.map(function (i) {
            return el('li', null, [el('span', i.met ? 'tick' : 'cross', [i.met ? '✓' : '✗']), rich('span', null, i.text)]);
          })));
          if (s.reasoning) step.appendChild(el('p', 'reasoning', [s.reasoning]));
        } else if (s.text) {
          step.appendChild(rich('p', null, s.text));
        }
        (s.asides || []).forEach(function (a) { step.appendChild(rich('p', 'aside ' + (a.tone || ''), a.text)); });
        flowEl.appendChild(step);
      });
      art.appendChild(flowEl);
      cs.appendChild(art);
    });
  }

  if (data.notRun && data.notRun.length) {
    var nr = section('Що не запускали', 'Ці перевірки не входять у результат вище. Кожна з них є залишковим ризиком.');
    nr.appendChild(table(['Перевірка', 'Чому не запускали', 'Як закрити'], data.notRun.map(function (r) {
      return [{ text: r.what, kind: 'wide' }, { text: r.why }, { text: r.howToClose || '' }];
    })));
  }

  if (data.findings && data.findings.length) {
    var fs = section(data.findingsTitle || 'Знахідки і ризики');
    fs.appendChild(el('div', 'findings', data.findings.map(function (f) {
      return el('div', 'finding ' + (f.status === 'fixed' ? 'fixed' : f.status === 'bad' ? 'bad' : ''), [rich('p', null, '**' + f.title + '**'), rich('p', null, f.text)]);
    })));
  }

  if (data.files && data.files.length) {
    var fl = section('Файли і відтворення');
    fl.appendChild(el('div', 'panel files', data.files.map(function (f) {
      return el('div', null, [el('span', null, [f.label]), rich('p', null, '`' + f.path + '`')]);
    })));
  }
})();
</script>
